<template>
    <lightning-card title="Upload and Download Excel">
        <div class="slds-var-p-around_medium">
            <lightning-input    type="file" 
                                accept=".csv, .xls, .xlsx" 
                                onchange={handleFileChange}>

            </lightning-input>
            <lightning-button   title="Download Processed Excel"
                                label="Download Excel" 
                                onclick={downloadExcel} 
                                class="slds-var-m-top_medium">
            </lightning-button>
        </div>
    </lightning-card>
</template>
