name: Salesforce Code Quality Gate

on:
  pull_request:
    branches: [main, SFAO2_Test]

jobs:
  run-code-analyzer:
    name: Scan Code for Quality & Security
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: npm install sf --global

      - name: Install Salesforce Code Analyzer Plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Run Code Analyzer
        run: |
          sf code-analyzer run --normalize-severity --outfile code-analyzer-results.sarif
        
      # Optional: Upload SARIF report to GitHub Security tab
      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: code-analyzer-results.sarif
          wait-for-processing: true